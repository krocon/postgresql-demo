# Folge 011 – wie Folge 007, aber das Schema verwaltet Flyway (db/migration/V*.sql)
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:notes}?currentSchema=ep011
spring.datasource.username=${POSTGRES_USER:app}
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway legt das Schema ep011 an und führt beim Start nur neue Migrationen aus
spring.flyway.schemas=ep011

# Folge 012 – Poolgröße bewusst festlegen (pro Instanz!)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
