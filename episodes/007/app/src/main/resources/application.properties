# Folge 007 – Verbindung zur Datenbank aus compose.yaml (Werte aus .env bzw. Umgebungsvariablen)
# Eigenes Schema ep007, damit sich die Folgen nicht in die Quere kommen.
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:notes}?currentSchema=ep007
spring.datasource.username=${POSTGRES_USER:app}
spring.datasource.password=${POSTGRES_PASSWORD}

# schema.sql beim Start ausführen (in Folge 011 übernimmt das Flyway)
spring.sql.init.mode=always
